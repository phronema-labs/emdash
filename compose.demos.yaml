services:
  caldwell:
    build:
      context: .
      dockerfile: Dockerfile.phronema-business
    volumes:
      - caldwell-data:/app/data
      - caldwell-uploads:/app/uploads
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.caldwell.rule=Host(`caldwell.phronemalabs.com`)"
      - "traefik.http.routers.caldwell.entrypoints=https"
      - "traefik.http.routers.caldwell.tls=true"
      - "traefik.http.routers.caldwell.tls.certresolver=letsencrypt"
      - "traefik.http.services.caldwell.loadbalancer.server.port=4321"
    networks:
      - coolify

  ironclad:
    build:
      context: .
      dockerfile: Dockerfile.demo-contractor
